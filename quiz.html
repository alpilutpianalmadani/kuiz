
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Quiz - Tutorial 1-8</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #080b12;
    color: #f5f5f5;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 700px;
    background: #111827;
    padding: 30px;
    border-radius: 18px;
    border: 1px solid #263449;
}

.header {
    text-align: center;
    margin-bottom: 25px;
}

.header h1 {
    color: #48d6d2;
    font-size: 27px;
    margin-bottom: 10px;
}

.header p {
    color: #aab5c5;
    font-size: 14px;
}

.progress-info {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
    color: #48d6d2;
    font-size: 14px;
}

.progress-bar {
    width: 100%;
    height: 8px;
    background: #263449;
    border-radius: 10px;
    margin-bottom: 25px;
    overflow: hidden;
}

.progress {
    height: 100%;
    width: 0%;
    background: #48d6d2;
    transition: 0.3s;
}

.question {
    font-size: 19px;
    line-height: 1.5;
    margin-bottom: 22px;
}

.option {
    background: #1c2738;
    border: 1px solid #34445c;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: 0.2s;
    font-size: 15px;
}

.option:hover {
    border-color: #48d6d2;
    background: #24364a;
}

.option.selected {
    background: #164e63;
    border-color: #48d6d2;
}

.option.correct {
    background: #14532d;
    border-color: #4ade80;
}

.option.wrong {
    background: #7f1d1d;
    border-color: #f87171;
}

.option.disabled {
    cursor: default;
}

.feedback {
    margin-top: 15px;
    font-size: 14px;
    line-height: 1.5;
    color: #aab5c5;
}

.buttons {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-top: 25px;
}

button {
    padding: 12px 22px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}

#prevBtn {
    background: #34445c;
    color: white;
}

#nextBtn {
    background: #48d6d2;
    color: #08111d;
}

button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.result {
    display: none;
    text-align: center;
}

.result h2 {
    color: #48d6d2;
    margin-bottom: 15px;
    font-size: 28px;
}

.score {
    font-size: 55px;
    font-weight: bold;
    color: #4ade80;
    margin: 20px 0;
}

.result p {
    color: #cbd5e1;
    line-height: 1.7;
}

.restart {
    margin-top: 25px;
    background: #48d6d2;
    color: #08111d;
}

@media(max-width: 500px) {
    .container {
        padding: 20px;
    }

    .header h1 {
        font-size: 22px;
    }

    .question {
        font-size: 17px;
    }

    .option {
        font-size: 14px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>ENGLISH QUIZ</h1>
        <p>Business English & General English</p>
        <p>Tutorial Session 1 - 8 | 16 Questions</p>
    </div>

    <div id="quiz">

        <div class="progress-info">
            <span id="questionNumber">Question 1 of 16</span>
            <span id="percentage">0%</span>
        </div>

        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>

        <h3 class="question" id="question"></h3>

        <div id="options"></div>

        <div class="feedback" id="feedback"></div>

        <div class="buttons">
            <button id="prevBtn" onclick="previousQuestion()">
                Previous
            </button>

            <button id="nextBtn" onclick="nextQuestion()" disabled>
                Next
            </button>
        </div>

    </div>

    <div class="result" id="result">
        <h2>QUIZ COMPLETED!</h2>
        <p>Your final score:</p>

        <div class="score" id="score">0</div>

        <p id="resultMessage"></p>

        <button class="restart" onclick="restartQuiz()">
            Try Again
        </button>
    </div>

</div>

<script>

const questions = [

{
    question: "1. When should informal English be used?",
    options: [
        "A. During a business negotiation",
        "B. When talking with close friends",
        "C. In a formal business letter",
        "D. During a job interview"
    ],
    answer: 1,
    explanation: "Informal English is commonly used with friends, family, and familiar people."
},

{
    question: "2. Which of the following is an example of an abbreviation?",
    options: [
        "A. Beautiful",
        "B. However",
        "C. ASAP",
        "D. Assistance"
    ],
    answer: 2,
    explanation: "ASAP stands for As Soon As Possible."
},

{
    question: "3. Which topic is considered safe for casual conversation?",
    options: [
        "A. Someone's salary",
        "B. Religious controversy",
        "C. Political conflict",
        "D. Hobbies and weather"
    ],
    answer: 3,
    explanation: "Weather and hobbies are general topics suitable for casual conversations."
},

{
    question: "4. Which position is responsible for managing financial activities in a company?",
    options: [
        "A. Financial Director",
        "B. Advertising Manager",
        "C. Sales Manager",
        "D. Personnel Officer"
    ],
    answer: 0,
    explanation: "The Financial Director is responsible for financial management."
},

{
    question: "5. What does Subject-Verb Agreement mean?",
    options: [
        "A. Correct spelling of words",
        "B. Agreement between subject and verb",
        "C. Correct use of punctuation",
        "D. Arrangement of paragraphs"
    ],
    answer: 1,
    explanation: "Subject and verb must agree in number and grammatical form."
},

{
    question: "6. Which tense is commonly used to describe a place?",
    options: [
        "A. Simple Past Tense",
        "B. Future Tense",
        "C. Simple Present Tense",
        "D. Past Perfect Tense"
    ],
    answer: 2,
    explanation: "Simple Present Tense is commonly used for describing places."
},

{
    question: "7. What is the correct structure of an email?",
    options: [
        "A. Subject, Salutation, Opening, Conclusion, Close",
        "B. Opening, Subject, Close, Salutation",
        "C. Salutation, Close, Subject, Conclusion",
        "D. Conclusion, Subject, Opening, Close"
    ],
    answer: 0,
    explanation: "A standard email structure starts with a subject and ends with a closing."
},

{
    question: "8. What is the main purpose of a business memo?",
    options: [
        "A. Personal communication with friends",
        "B. Publishing advertisements",
        "C. Writing a job application",
        "D. Internal communication within an organization"
    ],
    answer: 3,
    explanation: "A memo is used for internal communication in a company or organization."
},

{
    question: "9. What are the three important standards of business writing?",
    options: [
        "A. Creativity, Speed, and Humor",
        "B. Accuracy, Fluency, and Effectiveness",
        "C. Length, Design, and Decoration",
        "D. Grammar, Music, and Speaking"
    ],
    answer: 1,
    explanation: "The three standards are Accuracy, Fluency, and Effectiveness."
},

{
    question: "10. Which element is commonly included in a formal business letter?",
    options: [
        "A. Emojis",
        "B. Slang expressions",
        "C. Company letterhead",
        "D. Personal jokes"
    ],
    answer: 2,
    explanation: "A formal business letter includes a letterhead and other official elements."
},

{
    question: "11. Which sentence is appropriate for requesting information?",
    options: [
        "A. Could you please give me more information about this product?",
        "B. What's up with this product?",
        "C. I don't care about the product.",
        "D. Give me this product now!"
    ],
    answer: 0,
    explanation: "This sentence is a polite and formal request for information."
},

{
    question: "12. What should be included in a complaint letter?",
    options: [
        "A. Only personal opinions",
        "B. A funny story",
        "C. Unrelated information",
        "D. Details of the problem and the expected solution"
    ],
    answer: 3,
    explanation: "A complaint letter explains the problem and the action expected to resolve it."
},

{
    question: "13. What is the main purpose of an appreciation letter?",
    options: [
        "A. To complain about a service",
        "B. To express gratitude and appreciation",
        "C. To request a discount",
        "D. To cancel an appointment"
    ],
    answer: 1,
    explanation: "An appreciation letter expresses thanks for someone's help or contribution."
},

{
    question: "14. What does a solicited application letter mean?",
    options: [
        "A. Applying without knowing about a vacancy",
        "B. Writing a personal letter",
        "C. Applying for a known or advertised job vacancy",
        "D. Sending a complaint to a company"
    ],
    answer: 2,
    explanation: "A solicited application letter is written when the applicant knows about the job vacancy."
},

{
    question: "15. Which information is important in a Curriculum Vitae (CV)?",
    options: [
        "A. Personal information, education, experience, and skills",
        "B. Favorite movies only",
        "C. Daily entertainment activities",
        "D. Unrelated personal stories"
    ],
    answer: 0,
    explanation: "A CV presents personal details, educational background, experience, and skills."
},

{
    question: "16. Which expression is appropriate for suggesting a meeting time?",
    options: [
        "A. I don't want to meet you.",
        "B. Why are you here?",
        "C. I have no idea.",
        "D. Would Friday at 5 pm work for you?"
    ],
    answer: 3,
    explanation: "This is a polite expression for suggesting an appointment time."
}

];

let currentQuestion = 0;
let userAnswers = new Array(questions.length).fill(null);
let submitted = false;

const questionElement = document.getElementById("question");
const optionsElement = document.getElementById("options");
const feedbackElement = document.getElementById("feedback");
const nextBtn = document.getElementById("nextBtn");
const prevBtn = document.getElementById("prevBtn");

function loadQuestion() {

    submitted = false;

    const q = questions[currentQuestion];

    questionElement.textContent = q.question;

    optionsElement.innerHTML = "";
    feedbackElement.textContent = "";

    document.getElementById("questionNumber").textContent =
        `Question ${currentQuestion + 1} of ${questions.length}`;

    let percent = ((currentQuestion) / questions.length) * 100;

    document.getElementById("percentage").textContent =
        Math.round(percent) + "%";

    document.getElementById("progress").style.width =
        percent + "%";

    q.options.forEach((option, index) => {

        const div = document.createElement("div");

        div.className = "option";
        div.textContent = option;

        if (userAnswers[currentQuestion] === index) {
            div.classList.add("selected");
        }

        div.onclick = function() {

            if (submitted) return;

            userAnswers[currentQuestion] = index;

            document.querySelectorAll(".option").forEach(el => {
                el.classList.remove("selected");
            });

            div.classList.add("selected");

            nextBtn.disabled = false;
        };

        optionsElement.appendChild(div);

    });

    nextBtn.disabled = userAnswers[currentQuestion] === null;

    if (currentQuestion === questions.length - 1) {
        nextBtn.textContent = "Finish Quiz";
    } else {
        nextBtn.textContent = "Next";
    }

    prevBtn.disabled = currentQuestion === 0;

}

function nextQuestion() {

    if (userAnswers[currentQuestion] === null) return;

    if (currentQuestion < questions.length - 1) {

        currentQuestion++;
        loadQuestion();

    } else {

        showResult();

    }

}

function previousQuestion() {

    if (currentQuestion > 0) {

        currentQuestion--;
        loadQuestion();

    }

}

function showResult() {

    let correct = 0;

    questions.forEach((q, index) => {

        if (userAnswers[index] === q.answer) {
            correct++;
        }

    });

    let score = Math.round((correct / questions.length) * 100);

    document.getElementById("quiz").style.display = "none";

    const result = document.getElementById("result");
    result.style.display = "block";

    document.getElementById("score").textContent = score;

    document.getElementById("resultMessage").innerHTML =
        `Correct Answers: ${correct} / ${questions.length}<br>
         Wrong Answers: ${questions.length - correct} / ${questions.length}<br><br>
         ${
            score >= 90 ? "Excellent! Outstanding work!" :
            score >= 75 ? "Great job! Keep improving!" :
            score >= 60 ? "Good effort! Study the material again!" :
            "Keep practicing! Don't give up!"
         }`;

}

function restartQuiz() {

    currentQuestion = 0;

    userAnswers = new Array(questions.length).fill(null);

    document.getElementById("quiz").style.display = "block";

    document.getElementById("result").style.display = "none";

    loadQuestion();

}

loadQuestion();

</script>

</body>
</html>
